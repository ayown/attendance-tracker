upstream web {
    server web:3000;
}

upstream auth_service {
    server auth-service:3001;
}

upstream user_service {
    server user-service:3002;
}

upstream attendance_service {
    server attendance-service:3003;
}

upstream schedule_service {
    server schedule-service:3004;
}

upstream notification_service {
    server notification-service:3005;
}

server {
    listen 80;
    server_name attendance-tracker.ayown.me;

    client_max_body_size 10M;

    # Frontend
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth API — auth-service mounts routes at /api/auth
    location /api/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # User-service API — user-service mounts routes at /api/cohorts, /api/admins,
    # /api/stats, /api/students, /api/batches, /api/mentors (there is no /api/users
    # prefix in the actual service — see services/user-service/src/index.ts)
    location /api/cohorts/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/admins/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/stats/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/students/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/batches/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/mentors/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Attendance-service API — mounts at /api/attendance-codes, /api/attendance,
    # /api/reports (see services/attendance-service/src/index.ts)
    location /api/attendance-codes/ {
        proxy_pass http://attendance_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/attendance/ {
        proxy_pass http://attendance_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/reports/ {
        proxy_pass http://attendance_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.IO — hosted on attendance-service's HTTP server
    location /socket.io/ {
        proxy_pass http://attendance_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Schedule API
    location /api/schedules/ {
        proxy_pass http://schedule_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # notification-service currently has no routes beyond /health and is not
    # called by the frontend — intentionally not proxied.
}
